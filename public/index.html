<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fahm Al-Tibb</title><style>body{margin:0;background:#f4f7f7;color:#142321;font:14px system-ui}*{box-sizing:border-box}button,input,select,textarea{font:inherit}.wrap{max-width:430px;margin:auto;min-height:100vh;background:#f4f7f7}.top{position:sticky;top:0;background:#fff;padding:14px;border-bottom:1px solid #ddd;z-index:2;display:flex;justify-content:space-between}.p{padding:14px}.box,.item{background:#fff;border:1px solid #dfe8e6;border-radius:14px;padding:13px;margin:10px 0}.btn{border:1px solid #dfe8e6;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700}.primary{background:#0f766e;color:#fff;border-color:#0f766e}.wide{width:100%}input,select,textarea{width:100%;padding:10px;border:1px solid #dfe8e6;border-radius:10px;margin:5px 0 10px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;bottom:0;background:#fff;padding:8px;border-top:1px solid #ddd}.tabs button{border:0;background:0;padding:8px;font-size:11px}.q{line-height:1.5;margin:7px 0}.muted{color:#6a7875;font-size:11px}.badge{display:inline-block;padding:4px 7px;border-radius:20px;background:#e7f5f2;color:#0f766e;font-size:10px;font-weight:700}</style><div id=a></div><script>
const A=document.getElementById('a');let D,S={items:{}},page='home',card=1,filter='';
async function api(u,o={}){let r=await fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function auth(){A.innerHTML='<div class=p style="padding-top:15vh"><div class=box><h1>فهم الطب</h1><h2>Fahm Al-Tibb</h2><p class=muted>Private medical revision portal</p><input id=n placeholder="Name"><input id=e placeholder="Email" type=email><input id=pw placeholder="Password" type=password><button class="btn primary wide" onclick="login()">Log in</button><button class="btn wide" style="margin-top:7px" onclick="reg()">Request access</button><div id=msg></div></div></div>'}
async function login(){try{let j=await api('/api/login',{method:'POST',body:JSON.stringify({email:e.value,password:pw.value})});if(j.status!=='approved'){msg.innerHTML='<div class=box>Account status: <b>'+j.status+'</b>. Wait for approval.</div>';return}await boot()}catch(x){msg.innerHTML='<div class=box>'+esc(x.message)+'</div>'}}async function reg(){try{await api('/api/register',{method:'POST',body:JSON.stringify({name:n.value,email:e.value,password:pw.value})});msg.innerHTML='<div class=box>Request submitted. An administrator must approve your account.</div>'}catch(x){msg.innerHTML='<div class=box>'+esc(x.message)+'</div>'}}
async function boot(){D=await api('/api/data');S=(await api('/api/state')).state||S;render()}function item(t,c,r){return S.items[t+'|'+c+'|'+r]||{status:'Not started'}}function set(t,c,r,v){S.items[t+'|'+c+'|'+r]={...item(t,c,r),...v};api('/api/state',{method:'PUT',body:JSON.stringify({state:S})}).catch(()=>{})}
function title(){return page==='oral'?'Oral Bank':page==='practical'?'Practical Bank':page==='cards'?'Card Mode':'Fahm Al-Tibb'}function nav(){return '<div class=tabs><button onclick="page=\'home\';render()">⌂<br>Home</button><button onclick="page=\'oral\';render()">◉<br>Oral</button><button onclick="page=\'practical\';render()">▣<br>Practical</button><button onclick="page=\'cards\';render()">▤<br>Cards</button></div>'}function render(){if(!D)return auth();A.innerHTML='<div class=wrap><div class=top><b>'+title()+'</b><button class=btn onclick="logout()">Exit</button></div><div class=p id=c></div>'+nav()+'</div>';({home,oral,practical,cards}[page])()}
function home(){let all=[...D.oral.map(x=>({...x,t:'Oral'})),...D.practical.map(x=>({...x,t:'Practical'}))],m=all.filter(x=>item(x.t,x['Card No.'],x['PDF Row']).status==='Mastered').length;c.innerHTML='<div class=box><h1>Study Mission</h1><p class=muted>70 cards · '+D.meta.total_entries+' entries</p><h3>'+m+' / '+all.length+' mastered</h3><div class=box><button class="btn primary wide" onclick="page=\'cards\';render()">Open Card Mode</button></div><p class=muted>Use Oral/Practical search to find any topic, then tap an entry to update status.</p></div>'}
function list(t){let arr=t==='Oral'?D.oral:D.practical,rows=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(filter.toLowerCase()));c.innerHTML='<input id=search placeholder="Search '+t+'..." value="'+esc(filter)+'"><div class=muted>'+rows.length+' result(s)</div>'+rows.slice(0,250).map(x=>{let q=t==='Oral'?x['Question / Topic (PDF exact)']:(x['Station / topic (PDF exact)']||x['Instruction / task (PDF exact)']);let i=item(t,x['Card No.'],x['PDF Row']);return '<div class=item onclick="openEntry(\''+t+'\','+x['Card No.']+','+x['PDF Row']+')"><b>Card '+x['Card No.']+'</b> <span class=badge>'+esc(i.status)+'</span><div class=q>'+esc(q)+'</div><div class=muted>Page '+x['PDF Page']+' · '+esc(x['Study Region (derived)']||'')+'</div></div>'}).join('');search.oninput=()=>{filter=search.value;list(t)}}function oral(){list('Oral')}function practical(){list('Practical')}
function cards(){c.innerHTML='<h3>Card '+card+' / 70</h3><select id=jump>'+Array.from({length:70},(_,i)=>'<option '+(i+1===card?'selected':'')+'>'+(i+1)+'</option>').join('')+'</select><div><button class="btn" onclick="card=Math.max(1,card-1);cards()">‹</button> <button class="btn primary" onclick="openCard(card)">Open card</button> <button class="btn" onclick="card=Math.min(70,card+1);cards()">›</button></div><div class=box>Each card contains '+D.oral.filter(x=>x['Card No.']===card).length+' oral and '+D.practical.filter(x=>x['Card No.']===card).length+' practical entries.</div>';jump.onchange=()=>{card=+jump.value;cards()}}
function block(x,t){let q=t==='Oral'?x['Question / Topic (PDF exact)']:(x['Station / topic (PDF exact)']||x['Instruction / task (PDF exact)']),i=item(t,x['Card No.'],x['PDF Row']);return '<div class=item><div class=q>'+esc(q)+'</div><div class=muted>Card '+x['Card No.']+' · Page '+x['PDF Page']+'</div><select onchange="set(\''+t+'\','+x['Card No.']+','+x['PDF Row']+', {status:this.value});render()">'+['Not started','Studying','Revised once','Revised twice','Mastered'].map(v=>'<option '+(v===i.status?'selected':'')+'>'+v+'</option>').join('')+'</select></div>'}function openEntry(t,cno,r){let x=(t==='Oral'?D.oral:D.practical).find(z=>z['Card No.']===cno&&z['PDF Row']===r);c.innerHTML='<button class=btn onclick="page=\''+t.toLowerCase()+'\';render()">← Back</button>'+block(x,t)}function openCard(cno){let o=D.oral.filter(x=>x['Card No.']===cno),p=D.practical.filter(x=>x['Card No.']===cno);c.innerHTML='<button class=btn onclick="cards()">← Cards</button><h2>Card '+cno+'</h2><h3>Oral — '+o.length+'</h3>'+o.map(x=>block(x,'Oral')).join('')+'<h3>Practical — '+p.length+'</h3>'+p.map(x=>block(x,'Practical')).join('')}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}api('/api/me').then(x=>x.authenticated&&x.user.status==='approved'?boot():auth()).catch(auth)
</script></html>
